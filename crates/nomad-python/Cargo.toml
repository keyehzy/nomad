[package]
name = "nomad-python"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Optional PyO3 bridge for NOMAD V1 Rust core"

[lib]
name = "nomad_core_py"
crate-type = ["cdylib"]

[dependencies]
nomad-core = { path = "../nomad-core" }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]
